<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://yvykqdaqfbzzvouytfop.supabase.co wss://yvykqdaqfbzzvouytfop.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ميكروشامل">

<title>ميكروشامل راديوس — الإدارة المركزية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06101f;--bg2:#0a1830;--card:#0e1f3d;--card2:#12274a;--bd:#1d3763;--bd2:#27508a;--tx:#eaf1fc;--dim:#9fb2d3;--faint:#6d82a8;
--em:#22e08a;--em2:#12b56b;--blue:#3b9cff;--cyan:#22c7e8;--red:#ff4d63;--gold:#ffb020;--violet:#8b5cf6;--pink:#ec4899;
--r:16px;--sh:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Cairo,system-ui,sans-serif;color:var(--tx);font-size:14px;min-height:100vh;
background:radial-gradient(1100px 600px at 85% -10%,rgba(34,224,138,.10),transparent 60%),radial-gradient(900px 600px at 0% 110%,rgba(59,156,255,.10),transparent 60%),linear-gradient(180deg,#071226,#050c19)}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* ---- header ---- */
#top{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:14px;padding:0 18px;
background:linear-gradient(90deg,rgba(7,18,38,.96),rgba(10,32,40,.96));border-bottom:1px solid var(--bd);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;min-width:250px}
.brand .lg{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#1b8f5a,#0f5a8f);box-shadow:0 0 18px rgba(34,224,138,.35)}
.brand b{display:block;font-size:17px;letter-spacing:.3px;direction:ltr;text-align:right}.brand small{color:var(--dim);font-size:11.5px}
.sys{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;background:rgba(34,224,138,.12);border:1px solid rgba(34,224,138,.45);color:var(--em)}
.sys.bad{background:rgba(255,77,99,.12);border-color:rgba(255,77,99,.5);color:var(--red)}
.sys i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.tclock{color:var(--dim);font-size:12.5px;text-align:center;line-height:1.3}
.grow{flex:1}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;cursor:pointer;position:relative}
.ib .dot{position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:8px;font-size:13px}.me .av{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;border:1px solid var(--bd2)}
.me small{display:block;color:var(--dim);font-size:11px}
#burger{display:none}
/* ---- layout ---- */
#wrap{display:flex;min-height:calc(100vh - 64px)}
#side{width:250px;flex:none;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;padding:14px 10px 70px;
background:linear-gradient(180deg,rgba(9,22,45,.95),rgba(6,14,30,.95));border-inline-start:1px solid var(--bd)}
#side .hd{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin:2px 8px 12px;color:#ffd166}
#side a{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:3px 0;border-radius:12px;text-decoration:none;color:var(--dim);font-weight:700;font-size:13.5px;border:1px solid transparent}
#side a svg{width:20px;height:20px;flex:none}
#side a:hover{background:rgba(255,255,255,.04);color:var(--tx)}
#side a.on{color:#03150c;background:linear-gradient(90deg,#1fd17f,#18a866);box-shadow:0 0 18px rgba(34,224,138,.35)}
#side .ver{position:sticky;bottom:-60px;margin-top:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);display:flex;justify-content:space-between;color:var(--dim);font-size:12px;background:var(--bg2)}
main#view{flex:1;min-width:0;padding:18px 20px 40px}
/* ---- hero ---- */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:20px 24px;margin-bottom:16px;display:flex;align-items:center;gap:18px;
background:linear-gradient(100deg,rgba(18,40,80,.95),rgba(9,55,52,.85));border:1px solid var(--bd2);box-shadow:var(--sh)}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(500px 160px at 15% 50%,rgba(34,224,138,.18),transparent),radial-gradient(300px 120px at 95% 0,rgba(59,156,255,.2),transparent);pointer-events:none}
.hero .hi{width:64px;height:64px;flex:none;border-radius:18px;display:grid;place-items:center;background:rgba(34,224,138,.14);border:1px solid rgba(34,224,138,.5);color:var(--em)}
.hero .hi svg{width:36px;height:36px}
.hero h1{margin:0;font-size:24px;font-weight:800}.hero p{margin:4px 0 0;color:var(--dim)}
.hero .act{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
/* ---- tiles ---- */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.tile{position:relative;overflow:hidden;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;min-height:84px;border:1px solid rgba(255,255,255,.08);box-shadow:var(--sh)}
.tile .ti{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.14)}.tile .ti svg{width:26px;height:26px}
.tile b{display:block;unicode-bidi:plaintext;font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}.tile span{font-size:12.5px;opacity:.92}.tile small{display:block;font-size:11px;opacity:.75;margin-top:2px}
.t-green{background:linear-gradient(135deg,#0f8f57,#0b5e45)}.t-blue{background:linear-gradient(135deg,#1d6fd6,#123f8a)}.t-violet{background:linear-gradient(135deg,#7b3fe4,#4a1f9a)}
.t-gold{background:linear-gradient(135deg,#d9860b,#8a4d06)}.t-red{background:linear-gradient(135deg,#d62a45,#7d1326)}.t-cyan{background:linear-gradient(135deg,#0e9fbf,#0b5b78)}.t-navy{background:linear-gradient(135deg,#1a335f,#10213f)}
/* ---- cards/panels ---- */
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g32{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.panel{background:linear-gradient(180deg,rgba(16,34,66,.92),rgba(11,24,48,.92));border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);min-width:0}
.panel>h3{margin:-2px 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.panel>h3 svg{width:20px;height:20px;color:var(--em)}.panel>h3 .r{margin-inline-start:auto;display:flex;gap:6px}
.sec{margin:18px 0 10px;font-weight:800;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}.kv span{color:var(--dim)}.kv b{font-weight:700;text-align:left;direction:ltr;unicode-bidi:plaintext}
.ltr{direction:ltr;unicode-bidi:plaintext}
/* ---- buttons/forms ---- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;border:1px solid var(--bd2);background:var(--card2);font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;font-size:13px}
.btn:hover{filter:brightness(1.15)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.b-em{background:linear-gradient(135deg,#1fd17f,#12a463);border-color:transparent;color:#032013}.b-red{background:linear-gradient(135deg,#ff4d63,#c21d3a);border-color:transparent;color:#fff}
.b-blue{background:linear-gradient(135deg,#3b9cff,#1f5fd1);border-color:transparent;color:#fff}.b-gold{background:linear-gradient(135deg,#ffb020,#d9790b);border-color:transparent;color:#2a1600}
.b-violet{background:linear-gradient(135deg,#8b5cf6,#5b2fd6);border-color:transparent;color:#fff}
.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--bd2);background:#0a1830;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--em);box-shadow:0 0 0 3px rgba(34,224,138,.15)}
.bar input,.bar select{width:auto;min-width:150px}
label{display:block;font-size:12.5px;color:var(--dim);margin:10px 0 5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.sw{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd)}.sw:last-child{border:0}.sw span{flex:1}
.tg{appearance:none;width:42px;height:24px;border-radius:12px;background:#33435f;position:relative;cursor:pointer;padding:0;border:0;flex:none}
.tg:before{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.tg:checked{background:var(--em2)}.tg:checked:before{right:21px}
/* ---- tables ---- */
.tw{overflow:auto;border-radius:14px;border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:13px}
th[data-sort]{cursor:pointer;user-select:none}th.s-asc:after{content:" ▲";font-size:10px}th.s-desc:after{content:" ▼";font-size:10px}
th{background:linear-gradient(180deg,#143064,#0f2550);color:#cfe0ff;font-weight:800;text-align:right;padding:10px 12px;white-space:nowrap;position:sticky;top:0}
td{padding:9px 12px;border-top:1px solid rgba(39,80,138,.45);vertical-align:middle}
tr:hover td{background:rgba(59,156,255,.05)}
.empty{padding:26px;text-align:center;color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.p-g{background:rgba(34,224,138,.15);color:#3df29c;border:1px solid rgba(34,224,138,.4)}.p-r{background:rgba(255,77,99,.15);color:#ff7d8f;border:1px solid rgba(255,77,99,.45)}
.p-y{background:rgba(255,176,32,.15);color:#ffc65a;border:1px solid rgba(255,176,32,.45)}.p-b{background:rgba(59,156,255,.15);color:#7cbcff;border:1px solid rgba(59,156,255,.45)}
.p-v{background:rgba(139,92,246,.18);color:#b9a0ff;border:1px solid rgba(139,92,246,.45)}.p-x{background:rgba(160,175,200,.12);color:#b3c1da;border:1px solid rgba(160,175,200,.3)}
.acts{display:flex;gap:6px;flex-wrap:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding:5px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--bd);width:fit-content;max-width:100%}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:800;cursor:pointer;color:var(--dim)}
.tabs button.on{background:linear-gradient(135deg,#1fd17f,#12a463);color:#032013}
.note{border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.8;margin:0 0 12px;background:rgba(59,156,255,.1);border:1px solid rgba(59,156,255,.4)}
.note.warn{background:rgba(255,176,32,.1);border-color:rgba(255,176,32,.45)}.note.bad{background:rgba(255,77,99,.1);border-color:rgba(255,77,99,.5)}.note.ok{background:rgba(34,224,138,.08);border-color:rgba(34,224,138,.4)}
.pre{background:#040a16;border:1px solid var(--bd);border-radius:12px;padding:12px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;color:#cfe3ff}
.meter{height:8px;border-radius:6px;background:#1a2c4f;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#1fd17f,#3b9cff)}
.meter.w i{background:var(--gold)}.meter.f i{background:var(--red)}
.gauge{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none}
.gauge b{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:18px}
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding:6px 0;border-bottom:1px solid var(--bd)}
.chart div{flex:1;display:flex;flex-direction:column-reverse;gap:1px;min-width:3px;height:100%}.chart i{display:block;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#22e08a,#0e8a55)}.chart i.b{background:linear-gradient(180deg,#ff4d63,#a51530)}
.chart+.axis{display:flex;justify-content:space-between;color:var(--faint);font-size:11px;margin-top:4px;direction:ltr}
.leg{display:flex;gap:14px;font-size:12px;color:var(--dim)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.list{display:flex;flex-direction:column}.list>div{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid rgba(39,80,138,.4);font-size:13px}.list>div:last-child{border:0}
.dotx{width:9px;height:9px;border-radius:50%;flex:none;background:var(--faint)}.dotx.ok{background:var(--em);box-shadow:0 0 8px var(--em)}.dotx.bad{background:var(--red);box-shadow:0 0 8px var(--red)}.dotx.warn{background:var(--gold)}
.srv{display:flex;gap:14px;align-items:flex-start}.srv .box{width:70px;height:70px;border-radius:16px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#17345f,#0d1e3b);border:1px solid var(--bd2)}
.srv .box svg{width:40px;height:40px;color:#9fd3ff}
.pager{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:10px;color:var(--dim);font-size:12.5px}
.skel{height:84px;border-radius:16px;background:linear-gradient(90deg,#0e1f3d,#152b55,#0e1f3d);background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
/* ---- modal / toast ---- */
#modal{position:fixed;inset:0;z-index:50;background:rgba(2,6,15,.7);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
#mbox{width:min(560px,100%);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#10234a,#0b1a36);border:1px solid var(--bd2);border-radius:20px;padding:18px 20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#mbox.wide{width:min(900px,100%)}#mbox h3{margin:0 0 6px;font-size:18px}
.mact{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;padding:11px 18px;border-radius:12px;background:#0f8f57;font-weight:700;box-shadow:var(--sh);max-width:92vw}
#toast.bad{background:#c21d3a}
/* ---- login ---- */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
#login .box{width:min(420px,100%);padding:28px;border-radius:24px;background:linear-gradient(180deg,#10234a,#0a1830);border:1px solid var(--bd2);box-shadow:0 30px 80px rgba(0,0,0,.5)}
#login h1{margin:12px 0 2px;font-size:22px;direction:ltr;text-align:center}#login p{margin:0 0 14px;color:var(--dim);text-align:center}
#lerr{color:#ff8a9a;font-size:13px;min-height:20px;margin-top:8px}
/* ---- responsive ---- */
@media(max-width:1200px){.g3{grid-template-columns:1fr 1fr}.g32{grid-template-columns:1fr}}
@media(max-width:900px){
 #burger{display:grid}.brand{min-width:0}.sys{display:none}.brand b{font-size:15px}.brand small,.tclock,.me div{display:none}
 #side{position:fixed;top:64px;right:0;z-index:40;transform:translateX(105%);transition:.2s;box-shadow:var(--sh)}
 body.nav #side{transform:none}
 .g2,.g3{grid-template-columns:1fr}.f2,.f3{grid-template-columns:1fr}
 main#view{padding:12px}.hero{flex-wrap:wrap;padding:16px}.hero h1{font-size:19px}.hero .hi{width:48px;height:48px}
 .bar input,.bar select{min-width:0;flex:1 1 140px}
 .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile b{font-size:20px}
}

/* ===== Unified light/dark theme ===== */
:root{color-scheme:dark;--page:#050c19;--surface:#0e1f3d;--surface2:#12274a;--line:#1d3763;--text:#eaf1fc;--muted:#9fb2d3}
html[data-theme="light"]{color-scheme:light;--bg:#f3f6fb;--bg2:#e8eef7;--card:#fff;--card2:#edf3fa;--bd:#d8e1ed;--bd2:#c4d2e3;--tx:#172338;--dim:#52647c;--faint:#718096;--page:#f4f7fb;--surface:#fff;--surface2:#edf3fa;--line:#d8e1ed;--text:#172338;--muted:#52647c;--sh:0 8px 24px rgba(30,55,85,.09)}
html[data-theme="light"] body{background:linear-gradient(180deg,#f7f9fc,#edf2f8);color:var(--tx)}
html[data-theme="light"] #top{background:rgba(255,255,255,.94);border-color:var(--bd);box-shadow:0 3px 14px rgba(20,40,70,.06)}
html[data-theme="light"] #side{background:linear-gradient(180deg,#fff,#f2f6fb);border-color:var(--bd)}
html[data-theme="light"] #side .hd{color:#9a6700}
html[data-theme="light"] #side a{color:#52647c}
html[data-theme="light"] #side a:hover{background:#eaf1f8;color:#172338}
html[data-theme="light"] #side a.on{color:#063b27;background:linear-gradient(90deg,#baf3d5,#8ce8b9);box-shadow:none}
html[data-theme="light"] #side .ver{background:#f4f7fb;border-color:var(--bd);color:var(--dim)}
html[data-theme="light"] .panel{background:#fff;border-color:var(--bd);box-shadow:var(--sh)}
html[data-theme="light"] .panel>h3{border-color:var(--bd)}
html[data-theme="light"] .hero{background:linear-gradient(110deg,#e7f0ff,#e2f7ee);border-color:#c9dced;box-shadow:var(--sh)}
html[data-theme="light"] .hero p{color:#52647c}
html[data-theme="light"] .ib{background:#fff;border-color:var(--bd);color:#26364d}
html[data-theme="light"] .btn{background:#edf3fa;border-color:#cbd8e7;color:#26364d}
html[data-theme="light"] .btn.b-em{background:linear-gradient(135deg,#1fd17f,#12a463);border-color:transparent;color:#032013}
html[data-theme="light"] .btn.b-red,html[data-theme="light"] .btn.b-blue,html[data-theme="light"] .btn.b-gold,html[data-theme="light"] .btn.b-violet{color:#fff}
html[data-theme="light"] input,html[data-theme="light"] select,html[data-theme="light"] textarea{background:#fff;color:#172338;border-color:#cbd8e7}
html[data-theme="light"] input::placeholder,html[data-theme="light"] textarea::placeholder{color:#8795a8}
html[data-theme="light"] th{background:#e8eff8;color:#263c58}
html[data-theme="light"] td{border-top-color:#e3eaf2}
html[data-theme="light"] tr:hover td{background:#f2f7fc}
html[data-theme="light"] .tabs{background:#edf3f9;border-color:var(--bd)}
html[data-theme="light"] .tabs button{color:#52647c}
html[data-theme="light"] .tabs button.on{color:#063b27}
html[data-theme="light"] .pre{background:#f1f5fa;color:#24364e;border-color:var(--bd)}
html[data-theme="light"] .meter{background:#e1e9f2}
html[data-theme="light"] #login .box{background:linear-gradient(180deg,#fff,#f1f6fc);border-color:#d8e1ed;box-shadow:0 20px 60px rgba(30,55,85,.14)}
html[data-theme="light"] .tile{box-shadow:0 5px 16px rgba(20,40,70,.10)}
html[data-theme="light"] .note{color:#24405f}
html[data-theme="light"] #modal{background:rgba(25,40,60,.42)}
.theme-toggle{font-size:18px;line-height:1}
.login-theme{margin:0 auto 8px;display:grid}
@media(prefers-reduced-motion:no-preference){body,#top,#side,.panel,.ib,input,select,textarea{transition:background-color .18s ease,color .18s ease,border-color .18s ease}}


/* PWA install control */

/* ===== Full theme and contrast repair ===== */
/* Every colored statistic/shortcut tile uses white foreground in both themes.
   This avoids dark inherited text on navy/blue/green cards in light mode. */
#view .tile[class*="t-"],
#view .tile[class*="t-"]:link,
#view .tile[class*="t-"]:visited {
  color: #ffffff !important;
  -webkit-text-fill-color: #ffffff !important;
}
#view .tile[class*="t-"] *,
#view .tile[class*="t-"] *::before,
#view .tile[class*="t-"] *::after {
  color: #ffffff !important;
  -webkit-text-fill-color: #ffffff !important;
}
#view .tile[class*="t-"] .ti {
  color: #ffffff !important;
  background: rgba(255,255,255,.17) !important;
  border: 1px solid rgba(255,255,255,.12);
}
#view .tile[class*="t-"] .ti svg {
  stroke: #ffffff !important;
}
#view .tile b { font-weight: 800; }
#view .tile span { opacity: .96; }
#view .tile small { opacity: .86; }

/* Light theme: enforce readable text on light surfaces without changing semantic status colors. */

html[data-theme="light"] #view,

/* ===== Android + desktop responsive refinement ===== */
html {
  min-width: 320px;

}

  width: 100%;

}

  width: 100%;

}

/* ==========================================================
   Accessible theme layer — unified contrast for every screen
   ========================================================== */
:root {
  --app-text: #eaf1fc;
  --app-muted: #b7c8e2;
  --app-faint: #91a5c5;
  --app-surface: #0e1f3d;
  --app-surface-2: #12274a;
  --app-surface-raised: #152b50;
  --app-border: #294875;
  --app-input: #0a1830;
  --app-input-text: #f3f7ff;
  --app-placeholder: #a9bbd5;
  --app-modal: #0d1d39;
  --app-modal-text: #eaf1fc;
  --app-disabled-bg: #182b49;
  --app-disabled-text: #bdcbe0;
  --app-table-head: #143064;
  --app-table-text: #e4edfb;
  --app-row-hover: rgba(59,156,255,.10);
  --app-good-text: #55efad;
  --app-bad-text: #ff9aaa;
  --app-warn-text: #ffd17a;
  --app-info-text: #9dccff;
  --app-meter-track: #1a2c4f;
  --app-shadow: 0 10px 30px rgba(0,0,0,.28);
}
html[data-theme="light"] {
  --app-text: #172338;
  --app-muted: #40536d;
  --app-faint: #596b83;
  --app-surface: #ffffff;
  --app-surface-2: #f0f4f9;
  --app-surface-raised: #e8eef6;
  --app-border: #cbd7e5;
  --app-input: #ffffff;
  --app-input-text: #172338;
  --app-placeholder: #66778e;
  --app-modal: #ffffff;
  --app-modal-text: #172338;
  --app-disabled-bg: #e5ebf3;
  --app-disabled-text: #52647c;
  --app-table-head: #e8eff8;
  --app-table-text: #26364d;
  --app-row-hover: rgba(37,99,160,.08);
  --app-good-text: #087443;
  --app-bad-text: #b42338;
  --app-warn-text: #8a5200;
  --app-info-text: #155b9c;
  --app-meter-track: #dce5ef;
  --app-shadow: 0 8px 24px rgba(30,55,85,.10);
}

/* Base foreground and all common text-bearing components */
html[data-theme] body,
html[data-theme] #app,
html[data-theme] #view,
html[data-theme] .panel,
html[data-theme] .panel p,
html[data-theme] .panel li,
html[data-theme] .panel div,
html[data-theme] .panel span:not(.pill):not(.dotx),
html[data-theme] .panel b,
html[data-theme] .panel strong,
html[data-theme] .panel small,
html[data-theme] .hero h1,
html[data-theme] .sec,
html[data-theme] .kv b,
html[data-theme] .srv,
html[data-theme] .list,
html[data-theme] .empty {
  color: var(--app-text);
}
html[data-theme] .kv span,
html[data-theme] label,
html[data-theme] .pager,
html[data-theme] .leg,
html[data-theme] .brand small,
html[data-theme] .me small,
html[data-theme] .tclock,
html[data-theme] .hero p,
html[data-theme] .muted,
html[data-theme] .hint,
html[data-theme] .help,
html[data-theme] .sub,
html[data-theme] .desc {
  color: var(--app-muted);
}
html[data-theme] .faint,
html[data-theme] .text-muted,
html[data-theme] small.muted {
  color: var(--app-faint);
}

/* Modal and login: their surfaces and foreground must always belong to the same theme. */
html[data-theme] #mbox,
html[data-theme] #login .box {
  color: var(--app-modal-text);
  background: var(--app-modal);
  border-color: var(--app-border);
  box-shadow: var(--app-shadow);
}
html[data-theme] #mbox h3,
html[data-theme] #mbox p,
html[data-theme] #mbox div,
html[data-theme] #mbox span:not(.pill),
html[data-theme] #mbox b,
html[data-theme] #mbox strong,
html[data-theme] #mbox small,
html[data-theme] #login .box,
html[data-theme] #login .box label,
html[data-theme] #login .box p {
  color: var(--app-modal-text);
}
html[data-theme] #mbox label,
html[data-theme] #login .box label {
  color: var(--app-muted);
}
html[data-theme="light"] #modal {
  background: rgba(25,40,60,.38);
}
html[data-theme="light"] #mbox,
html[data-theme="light"] #login .box {
  background: linear-gradient(180deg,#ffffff,#f3f7fc);
  color: #172338;
}
html[data-theme="dark"] #mbox,
html[data-theme="dark"] #login .box {
  background: linear-gradient(180deg,#10234a,#0b1a36);
  color: #eaf1fc;
}

/* Form fields, placeholders, dropdown options and disabled controls */
html[data-theme] input:not([type="checkbox"]):not([type="radio"]),
html[data-theme] select,
html[data-theme] textarea {
  background: var(--app-input);
  color: var(--app-input-text);
  border-color: var(--app-border);
  -webkit-text-fill-color: var(--app-input-text);
  caret-color: var(--em);
}
html[data-theme] input::placeholder,
html[data-theme] textarea::placeholder {
  color: var(--app-placeholder);
  opacity: 1;
}
html[data-theme] option {
  background: var(--app-surface);
  color: var(--app-text);
}
html[data-theme] .btn:disabled,
html[data-theme] button:disabled,
html[data-theme] input:disabled,
html[data-theme] select:disabled,
html[data-theme] textarea:disabled {
  opacity: 1;
  cursor: not-allowed;
}
html[data-theme] .btn:disabled,
html[data-theme] button:disabled {
  background-color: var(--app-disabled-bg);
  border-color: var(--app-border);
  color: var(--app-disabled-text);
  -webkit-text-fill-color: var(--app-disabled-text);
}
html[data-theme] input:disabled,
html[data-theme] select:disabled,
html[data-theme] textarea:disabled {
  background: var(--app-disabled-bg);
  color: var(--app-disabled-text);
  -webkit-text-fill-color: var(--app-disabled-text);
}

/* Tables and database views */
html[data-theme] .tw,
html[data-theme] table {
  border-color: var(--app-border);
}
html[data-theme] th {
  background: var(--app-table-head);
  color: var(--app-text);
}
html[data-theme] td {
  color: var(--app-table-text);
  border-top-color: var(--app-border);
}
html[data-theme] tr:hover td {
  background: var(--app-row-hover);
}
html[data-theme] .empty {
  color: var(--app-muted);
}

/* Semantic status labels keep strong contrast in both themes. */
html[data-theme="light"] .p-g { color:#087443; background:#e2f7ec; border-color:#8bd9ad; }
html[data-theme="light"] .p-r { color:#a51f35; background:#fde9ec; border-color:#efacb7; }
html[data-theme="light"] .p-y { color:#805000; background:#fff3d8; border-color:#e8c77f; }
html[data-theme="light"] .p-b { color:#155b9c; background:#e6f2ff; border-color:#a9cdf4; }
html[data-theme="light"] .p-v { color:#5930a8; background:#f0eaff; border-color:#c6b3f4; }
html[data-theme="light"] .p-x { color:#46566b; background:#edf1f5; border-color:#cbd5df; }
html[data-theme="dark"] .p-g { color:#55efad; }
html[data-theme="dark"] .p-r { color:#ff9aaa; }
html[data-theme="dark"] .p-y { color:#ffd17a; }
html[data-theme="dark"] .p-b { color:#9dccff; }
html[data-theme="dark"] .p-v { color:#c9b5ff; }
html[data-theme="dark"] .p-x { color:#c1cee0; }
html[data-theme="light"] .note { color:#24405f; }
html[data-theme="light"] .note.warn { color:#805000; }
html[data-theme="light"] .note.bad { color:#9e2639; }
html[data-theme="light"] .note.ok { color:#087443; }
html[data-theme="dark"] .note { color:#dceaff; }
html[data-theme="dark"] .note.warn { color:#ffd17a; }
html[data-theme="dark"] .note.bad { color:#ffb0bb; }
html[data-theme="dark"] .note.ok { color:#8cf0bf; }

/* Code/JSON, server info, charts, gauges and progress components */
html[data-theme] .pre {
  background: var(--app-input);
  color: var(--app-text);
  border-color: var(--app-border);
}
html[data-theme] .meter { background: var(--app-meter-track); }
html[data-theme] .gauge b {
  background: var(--app-surface);
  color: var(--app-text);
}
html[data-theme] .srv .box {
  background: var(--app-surface-2);
  color: var(--app-text);
  border-color: var(--app-border);
}
html[data-theme] .srv .box svg { color: var(--app-info-text); }
html[data-theme] .tabs {
  background: var(--app-surface-2);
  border-color: var(--app-border);
}
html[data-theme] .tabs button { color: var(--app-muted); }
html[data-theme] .tabs button.on {
  background: linear-gradient(135deg,#1fd17f,#12a463);
  color: #032013;
}
html[data-theme] .panel,
html[data-theme] .tile,
html[data-theme] .hero,
html[data-theme] #side,
html[data-theme] #top {
  transition: background-color .18s ease, color .18s ease, border-color .18s ease;
}

/* Inline status text used by charts and authentication summaries. */
html[data-theme] [style*="color:#ff8a9a"],
html[data-theme] [style*="color: #ff8a9a"] {
  color: var(--app-bad-text) !important;
}
html[data-theme] [style*="color:var(--dim)"],
html[data-theme] [style*="color: var(--dim)"] {
  color: var(--app-muted) !important;
}
html[data-theme] [style*="color:var(--faint)"],
html[data-theme] [style*="color: var(--faint)"] {

function dbArKey(k) {
  if (DB_AR_KEY_MORE[k]) return DB_AR_KEY_MORE[k];
  if (DB_AR_JSON_KEYS[k]) return DB_AR_JSON_KEYS[k];
  if (DB_AR_COLUMNS[k]) return DB_AR_COLUMNS[k];
  const parts=String(k).split('_');
  if (parts.length>1 && parts.every(x=>DB_AR_WORDS[x])) return parts.map(x=>DB_AR_WORDS[x]).join(' ');
  return dbArColumn(k);
}
function dbArEnum(v) {
  const s=String(v), low=s.toLowerCase();
  if (Object.prototype.hasOwnProperty.call(DB_AR_ENUM,low)) return DB_AR_ENUM[low];
  if (Object.prototype.hasOwnProperty.call(REASON_AR,low)) return REASON_AR[low];
  if (ACT_MORE[s]) return ACT_MORE[s];
  if (ACT[s]) return ACT[s];
  if (PERM_AR[s]) return PERM_AR[s];
  if (/^[a-f0-9]{8}-[a-f0-9-]{27,}$/i.test(s) || /^[0-9a-f]{12,}$/i.test(s)) return s;
  return s;
}
function dbArDisplay(value,key='') {
  if (value === null || value === undefined) return 'غير محدد';
  if (typeof value === 'boolean') return value ? 'نعم' : 'لا';
  if (typeof value === 'number') return String(value);
  if (value instanceof Date) return new Intl.DateTimeFormat('ar-YE-u-nu-latn',{dateStyle:'medium',timeStyle:'short'}).format(value);
  if (Array.isArray(value)) return value.map(v=>dbArDisplay(v,key)).join('، ');
  if (typeof value === 'object') return dbArJson(value);
  const s=String(value), k=String(key||'').toLowerCase();
  if (/^(?:[0-9a-f]{8}-[0-9a-f-]{27,}|[0-9a-f]{12,})$/i.test(s)) return s;
  if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s) || /^\d{1,3}(?:\.\d{1,3}){3}$/.test(s) ||
      /^([0-9a-f]{2}[:-]){5}[0-9a-f]{2}$/i.test(s) || /^https?:\/\//i.test(s)) return s;
  if (/^\d{4}-\d\d-\d\d[T ]\d\d:\d\d/.test(s)) {
    const d=new Date(s);
    if (!Number.isNaN(d.getTime())) return new Intl.DateTimeFormat('ar-YE-u-nu-latn',{dateStyle:'medium',timeStyle:'short'}).format(d);
  }
  if (['role','actor_role','scope','status','state','type','kind','mode','action','event','result','reason','service','method','stage','source','operation','permission','auth_type'].includes(k)) {
    if (k==='permission') return dbArPermission(s);
    return dbArEnum(s);
  }
  return dbArEnum(s);
}

async function dbClean(B, alive) {

  const draw = () => { B.innerHTML = `<div class="grid g3">${Object.entries(DBK).map(([k, m]) => `<div class="panel"><h3>${I('trash')}${m[0]}</h3><div style="font-size:26px;font-weight:800">${fmt(cnt(k))}</div><div style="color:var(--dim);font-size:12.5px;margin:4px 0 10px">${m[1]}</div>
      <div class="acts" style="flex-wrap:wrap">${m[4] ? `<select data-dd="${k}" style="width:auto">${m[4].map(d => `<option value="${d}" ${DAYS[k] === d ? 'selected' : ''}>${d ? 'أقدم من ' + d + ' يوم' : 'الكل'}</option>`).join('')}</select>` : ''}<button class="btn sm b-red" data-k="${k}" ${cnt(k) ? '' : 'disabled'}>${m[2]}</button>${pill(m[3] ? 'p-g' : 'p-y', m[3] ? 'قابل للتراجع' : 'نهائي')}</div></div>`).join('')}</div>`;
    $$('[data-dd]', B).forEach(s => s.onchange = () => { DAYS[s.dataset.dd] = +s.value; draw(); }); $$('[data-k]', B).forEach(b => b.onclick = () => go(b.dataset.k)); };

<script>
(function(){
  'use strict';
  var installEvent = null;
  var installButton = document.getElementById('pwaInstall');
  var standalone = window.matchMedia('(display-mode: standalone)').matches ||
                   window.navigator.standalone === true;

  function hideInstallButton(){
    if (installButton) installButton.classList.add('hide');
  }
  function showInstallHelp(){
    // Detect phones/tablets robustly; some Android browsers expose a reduced UA.
    var ua = navigator.userAgent || '';
    var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) ||
      (window.matchMedia && window.matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) <= 1024);
    var isAndroid = /Android/i.test(ua) || (isMobile && !/iPhone|iPad|iPod/i.test(ua));
    var steps = isAndroid
      ? 'لتثبيت MikroShamel RADIUS على هاتف Android: اضغط «حسنًا»، ثم افتح قائمة المتصفح (⋮) واختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية». إذا ظهر زر «تثبيت التطبيق» في الصفحة فجرّبه أولًا.'
      : isMobile
        ? 'لتثبيت التطبيق على الهاتف: افتح قائمة المتصفح واختر «إضافة إلى الشاشة الرئيسية» أو «تثبيت التطبيق».'
        : 'لتثبيت التطبيق على الكمبيوتر: افتح Chrome أو Edge ثم اختر «تثبيت MikroShamel RADIUS» من قائمة المتصفح أو رمز التثبيت بجانب شريط العنوان.';
    if (typeof window.showToast === 'function') window.showToast(steps);
    else window.alert(steps);
  }

  if (installButton && !standalone) {
    // Keep installation discoverable even in browsers that do not expose
    // beforeinstallprompt; the click then shows the browser-specific steps.
    installButton.classList.remove('hide');

    window.addEventListener('beforeinstallprompt', function(event){
      event.preventDefault();
      installEvent = event;
      installButton.textContent = '⬇️ تثبيت التطبيق';
      installButton.classList.remove('hide');
    });

    installButton.addEventListener('click', async function(){
      if (!installEvent) {
        showInstallHelp();
        return;
      }
      installButton.disabled = true;
      try {
        await installEvent.prompt();
        await installEvent.userChoice;
        installEvent = null;
        hideInstallButton();
      } catch (error) {
        console.warn('PWA install prompt:', error);
      } finally {
        installButton.disabled = false;
      }
    });

    window.addEventListener('appinstalled', function(){
      installEvent = null;
      hideInstallButton();
    });
  } else {
    hideInstallButton();
  }

  if ('serviceWorker' in navigator && window.isSecureContext) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/radius/service-worker.js', {scope: '/radius/'})
        .then(function(reg){ console.info('PWA service worker ready:', reg.scope); })
        .catch(function(error){ console.error('PWA service worker registration failed:', error); });
    });
  }
})();
</script>
